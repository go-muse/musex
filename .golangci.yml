# Format: golangci-lint fmt ./...
# Check:  golangci-lint run ./...
formatters:
  enable:
    - gofmt
    - gci
  settings:
    gci:
      custom-order: true
      sections:
        - standard
        - prefix(github.com/go-muse/musex)
        - default
