version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      # Import barrier. Every rule uses strict mode: an import is allowed only
      # if it matches an allow entry. All rules that match a file apply, so an
      # import must be allowed by each of them. A trailing "/" matches the
      # packages under a path; a trailing "$" matches exactly one package.
      rules:
        # Non-test files: the standard library and musex packages only.
        module:
          list-mode: strict
          files:
            - "$all"
            - "!$test"
          allow:
            - $gostd
            - github.com/go-muse/musex/
        # Test files, including examples and fuzz tests: the standard library,
        # any musex package, and Testify.
        tests:
          list-mode: strict
          files:
            - "$test"
          allow:
            - $gostd
            - github.com/go-muse/musex/
            - github.com/stretchr/testify/

        # Package rules: one rule per planned package, in the order of the
        # package plan. Each rule allows the standard library and exactly the
        # planned direct musex imports of its package, for non-test files.
        # A rule covers only its own directory, not subdirectories. The rule
        # name is the package path with "/" replaced by "-". When the planned
        # imports of a package change, change its rule in the same change.
        letter:
          list-mode: strict
          files:
            - "**/letter/*.go"
            - "!$test"
          allow:
            - $gostd
        alteration:
          list-mode: strict
          files:
            - "**/alteration/*.go"
            - "!$test"
          allow:
            - $gostd
          deny:
            - pkg: math/big
              desc: alteration values have a fixed size; arbitrary-precision numbers are not used
        spelling:
          list-mode: strict
          files:
            - "**/spelling/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/go-muse/musex/letter$
            - github.com/go-muse/musex/alteration$
        octave-number:
          list-mode: strict
          files:
            - "**/octave/number/*.go"
            - "!$test"
          allow:
            - $gostd
        octave-naming:
          list-mode: strict
          files:
            - "**/octave/naming/*.go"
            - "!$test"
          allow:
            - $gostd
        octave:
          list-mode: strict
          files:
            - "**/octave/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/go-muse/musex/octave/number$
            - github.com/go-muse/musex/octave/naming$
        pitch:
          list-mode: strict
          files:
            - "**/pitch/*.go"
            - "!$test"
          allow:
            - $gostd
            - github.com/go-muse/musex/spelling$
            - github.com/go-muse/musex/octave$
        pitchclass:
          list-mode: strict
          files:
            - "**/pitchclass/*.go"
            - "!$test"
          allow:
            - $gostd
        pcset:
